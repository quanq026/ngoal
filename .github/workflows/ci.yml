name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck API
        run: cd apps/api && bunx tsc --noEmit

      - name: Typecheck Web
        run: cd apps/web && bunx tsc --noEmit

      - name: Build Web
        env:
          NODE_OPTIONS: --max-old-space-size=3072
          NEXT_TELEMETRY_DISABLED: '1'
        run: cd apps/web && bun run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=ngoal-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ngoal-${{ matrix.service }}
